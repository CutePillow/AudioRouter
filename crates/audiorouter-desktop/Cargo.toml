[package]
name = "audiorouter-desktop"
version = "1.0.0"
edition = "2021"
description = "AudioRouter Windows desktop application"
license = "GPL-3.0-only"
build = "build.rs"

[dependencies]
audiorouter-core = { path = "../audiorouter-core" }
eframe = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.32"
wry = "0.50"
opus = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_System_Com"] }
windows-sys = { version = "0.59", features = ["Win32_Devices_Bluetooth", "Win32_Foundation", "Win32_Media_Audio", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
